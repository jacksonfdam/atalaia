name: Feature request
description: Something Atalaia should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out
      description: |
        The question you are asking your fleet that Atalaia cannot answer today. Not the
        feature — the question. Most good features here turn out to be a different shape
        from the one first asked for.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do instead, today
      description: Manually, in another tool, or not at all.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new vulnerability source
        - A new ecosystem or manifest format
        - A new notification channel
        - A new model provider
        - Something for agents (MCP)
        - The console
        - The CLI
        - Correlation, relevance or scoring
        - Something else
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **A new source, ecosystem, channel or provider is usually one file plus one line
        in a registry**, and those make good first contributions — see
        [CONTRIBUTING.md](https://github.com/jacksonfdam/atalaia/blob/main/CONTRIBUTING.md).
        Say so if you would like to write it.
