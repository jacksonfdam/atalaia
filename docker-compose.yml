# Three services, no database.
#
# Postgres is Supabase: the local stack in development (`supabase start`, which
# brings up its own containers) or a cloud project in production. Either way it
# is reached through DATABASE_URL, which is why nothing here declares a volume —
# there is no longer any state on this side to keep.
services:
  atalaia:
    build:
      context: .
      dockerfile: Dockerfile
    # The port comes from .env so a custom PORT stays consistent between the
    # container, the published port and the health check.
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # host.docker.internal reaches the Supabase stack running on the host.
      # A cloud project just works: its host is on the internet.
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The worker. Same image, different entry point: it opens no port and takes
  # jobs off the queue — feed cycles, repository scans, freshness checks and the
  # weekly report. Scaling it is `docker compose up --scale atalaia-worker=N`;
  # the queue hands each job to exactly one of them.
  atalaia-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "src/interface/worker.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    # No HTTP to check. A worker that cannot reach Postgres exits, and `restart`
    # brings it back — which is the honest signal here.
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Management console. A separate service: it reaches the API over HTTP only
  # and never touches the database.
  atalaia-console:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "${UI_PORT:-3001}:${UI_PORT:-3001}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - UI_PORT=${UI_PORT:-3001}
      # Service name, not localhost — the API is a different container.
      - ATALAIA_API_URL=http://atalaia:${PORT:-3000}
    depends_on:
      atalaia:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${UI_PORT:-3001}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
