# Three services, no database.
#
# Postgres is not here on purpose: bring your own — a container, a managed
# instance, anything speaking 13 or later — and reach it through DATABASE_URL.
# Which is why nothing here declares a volume: there is no state on this side
# to keep.
services:
  atalaia:
    build:
      context: .
      dockerfile: Dockerfile
    # The port comes from .env so a custom PORT stays consistent between the
    # container, the published port and the health check.
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Required, and it has to be reachable *from inside a container*: a local
      # A database on 127.0.0.1 is the container itself in here. The launcher
      # translates loopback to host.docker.internal for you; running compose by
      # hand means exporting it yourself.
      - DATABASE_URL=${DATABASE_URL:?set it to a URL a container can reach, or run ./scripts/atalaia.sh up}
    # Linux does not resolve host.docker.internal on its own.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The worker. Same image, different entry point: it opens no port and takes
  # jobs off the queue — feed cycles, repository scans, freshness checks and the
  # weekly report. Scaling it is `docker compose up --scale atalaia-worker=N`;
  # the queue hands each job to exactly one of them.
  atalaia-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "src/interface/worker.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?set it to a URL a container can reach, or run ./scripts/atalaia.sh up}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # No HTTP to check. A worker that cannot reach Postgres exits, and `restart`
    # brings it back — which is the honest signal here.
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Management console. A separate service: it reaches the API over HTTP only
  # and never touches the database.
  atalaia-console:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "${UI_PORT:-3001}:${UI_PORT:-3001}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - UI_PORT=${UI_PORT:-3001}
      # Service name, not localhost — the API is a different container.
      - ATALAIA_API_URL=http://atalaia:${PORT:-3000}
    depends_on:
      atalaia:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${UI_PORT:-3001}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
